name: Ruff
run-name: ${{github.actor}} is checking the code with `ruff check --fix`
on: [push]

permissions:
  contents: write

concurrency:
  group: ruff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: --version

      - run: ruff check --fix --exit-zero
      - run: ruff format

      - name: Commit changes if any
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No ruff fixes to commit."
          else
            git commit -m "Apply ruff fixes"
            git push origin HEAD:${{ github.ref_name }}
          fi

      # Runs last so auto-fixes are already committed above; fails the job
      # only on violations ruff could not fix itself.
      - name: Report unfixable violations
        run: ruff check --output-format=github
