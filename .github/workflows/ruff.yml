name: Ruff
run-name: ${{github.actor}} is checking the code with `ruff`
on: [push]

# Read-only: formatting is applied locally by the pre-commit hook
# (see .pre-commit-config.yaml), so CI never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ruff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: --version

      - name: Lint
        run: ruff check --output-format=github

      - name: Check formatting
        run: ruff format --check --diff
